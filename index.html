P.splash=()=>`<div style="text-align:center;padding-top:12vh"><div style="font-size:72px">🌿</div><h1>Nee enga irukkeenga?</h1><p class="m">Detecting your location with GPS…</p><div id="gs" class="m"></div><div id="man" style="display:none;text-align:left" class="c"><h3>GPS not available</h3><p class="m">Type your district and confirm.</p><input id="dq" list="dl" placeholder="e.g. Tiruvallur" autocomplete="off"><datalist id="dl">${DN.map(d=>`<option>${d}`).join("")}</datalist><button onclick="manual()">Confirm district</button></div></div>`;
function gps(cb){if(!navigator.geolocation)return failGps();navigator.geolocation.getCurrentPosition(p=>{const la=p.coords.latitude,lo=p.coords.longitude;setLoc(la,lo,nearest(la,lo),cb)},failGps,{timeout:10000,enableHighAccuracy:true})}
function failGps(){const m=$("#man");if(m){m.style.display="block";$("#gs").textContent=""}else toast("Could not get GPS – allow location access")}
function setLoc(la,lo,d,cb){DB.loc={lat:la,lon:lo,district:d,t:Date.now()};save();sb("locations",{user:DB.sess&&DB.sess.id,district:d,lat:la,lon:lo});log("Location: "+d);cb?cb():go(DB.sess?"home":"login")}
function manual(){const v=$("#dq").value.trim(),c=D.find(x=>x.n.toLowerCase()==v.toLowerCase());if(!c)return toast("Choose a valid Tamil Nadu district");setLoc(c.la,c.lo,c.n)}
let mode="in";
P.login=()=>`<div style="padding-top:6vh"><div style="font-size:54px;text-align:center">🌿</div><h1 style="text-align:center">Green Guard</h1><p class="m" style="text-align:center">Tamil Nadu weather · alerts · farming help</p><div class="c"><div class="seg" style="padding:0 0 8px"><a onclick="mode='in';go('login')" class="${mode=="in"?"on":""}">Sign in</a><a onclick="mode='up';go('login')" class="${mode=="up"?"on":""}">Create account</a></div>
${mode=="up"?`<input id="nm" placeholder="Full name" autocomplete="name">`:""}<input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password${mode=="up"?" (min 6 characters)":""}" autocomplete="${mode=="up"?"new-password":"current-password"}">
${mode=="up"?`<select id="ds">${DN.map(d=>`<option ${DB.loc&&DB.loc.district==d?"selected":""}>${d}`).join("")}</select><select id="ut"><option>Farmer<option>General<option>Fisherman<option>Student</select>`:""}
<button onclick="${mode=="up"?"register()":"signin()"}">${mode=="up"?"Create account":"Sign in"}</button></div></div>`;
async function register(){const e=$("#em").value.trim().toLowerCase(),n=$("#nm").value.trim(),p=$("#pw").value;if(!n||!/^\S+@\S+\.\S+$/.test(e))return toast("Enter name and a valid email");if(p.length<6)return toast("Password needs 6+ characters");toast("Creating account…");
if(SBon()){try{const j=await sbAuth("signup",{email:e,password:p,data:{name:n,district:$("#ds").value,type:$("#ut").value}});if(!j.access_token)return toast("Check your email to confirm, then sign in");setTok(j);await afterAuth(j.user.id)}catch(x){toast(x.message)}return}
if(DB.users.some(u=>u.email==e)||e==ADMIN_EMAIL)return toast("Email already registered");
const u={id:"u"+Date.now(),name:n,email:e,ph:await sha(p),district:$("#ds").value,type:$("#ut").value,blocked:false,last:Date.now(),lat:DB.loc.lat,lon:DB.loc.lon,created:Date.now()};DB.users.push(u);DB.sess={id:u.id,role:"user"};save();log("Registered");go("home")}
async function afterAuth(id){let pr=(await sbq("/rest/v1/profiles?id=eq."+id+"&select=*"))[0];if(!pr)throw new Error("Profile missing – run supabase.sql first");if(pr.blocked){DB.tok=DB.rt=null;save();return toast("Account blocked by admin")}
DB.users=[{id:pr.id,name:pr.name,email:pr.email,district:pr.district,type:pr.type,blocked:false,last:Date.now()}];DB.sess={id:pr.id,role:pr.role};DB.pulled=0;lastPull=0;save();sbq("/rest/v1/profiles?id=eq."+id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({last_seen:new Date().toISOString(),lat:DB.loc.lat,lon:DB.loc.lon})}).catch(()=>{});log(pr.role=="admin"?"Admin login":"Login");go(pr.role=="admin"?"admin/dashboard":"home")}
async function signin(){const e=$("#em").value.trim().toLowerCase(),p=$("#pw").value;if(!e||!p)return toast("Enter email and password");toast("Signing in…");
if(SBon()){try{const j=await sbAuth("token?grant_type=password",{email:e,password:p});setTok(j);await afterAuth(j.user.id)}catch(x){toast(x.message)}return}
if(e==ADMIN_EMAIL){if(await sha(e+":"+p)!==ADMIN_H)return toast("Wrong password");DB.sess={id:"admin",role:"admin"};save();log("Admin login");return go("admin/dashboard")}
const u=DB.users.find(x=>x.email==e);if(!u||u.ph!==await sha(p))return toast("Wrong email or password");if(u.blocked)return toast("Account blocked by admin");u.last=Date.now();DB.sess={id:u.id,role:"user"};save();log("Login");go("home")}
const logout=()=>{DB.sess=null;DB.tok=DB.rt=null;save();go("login")};
P.home=async()=>{const c=DB.loc,{w,off}=await loadW({la:c.lat,lo:c.lon},"w_"+c.district);if(!w)return`<h1>${esc(c.district)}</h1>`+noData();
const j=w.j,cu=j.current,d=j.daily,[cn,ic]=WC(cu.weather_code),lv=lvl(Math.max(cu.wind_gusts_10m,d.wind_gusts_10m_max[0]),d.weather_code[0],d.precipitation_probability_max[0],d.precipitation_sum[0]),m=new Date().getMonth(),h=new Date().getHours();
const bg=lv=="R"?"linear-gradient(160deg,#3a1c4d,#7a2a45)":lv=="Y"?"linear-gradient(160deg,#334e68,#5b7c99)":cu.is_day?"linear-gradient(160deg,#1c7ed6,#74c0fc)":"linear-gradient(160deg,#0b1d3a,#243b6b)";
const hv=j.hourly.temperature_2m.slice(h,h+24),hp=j.hourly.precipitation_probability.slice(h,h+24),al=DB.alerts.filter(a=>a.d==c.district),aq=w.aq?w.aq.us_aqi:null;log("Viewed home");
return`${off?`<div class="c" style="border-color:var(--y)">📴 Offline – showing last saved reading from ${fmt(w.t)}</div>`:""}
${al.map(a=>`<div class="c" style="border-color:${COL[a.sev]}"><span class="pill ${a.sev}">Official alert</span><p style="margin:8px 0 0"><b>${esc(a.msg)}</b></p><div class="m">Issued by Green Guard admin · ${fmt(a.t)}</div></div>`).join("")}
<div class="c hero" style="background:${bg}"><div style="display:flex;justify-content:space-between"><div><div style="font-size:20px;font-weight:600">📍 ${esc(c.district)}</div><div style="opacity:.8">${cn} · ${season(m)}</div></div><div style="font-size:46px">${ic}</div></div><div class="t" style="margin:18px 0 6px">${Math.round(cu.temperature_2m)}°</div><div style="opacity:.85">Feels ${Math.round(cu.apparent_temperature)}° · H ${Math.round(d.temperature_2m_max[0])}° L ${Math.round(d.temperature_2m_min[0])}°</div><div style="margin-top:12px">${pill(lv)}</div><div style="margin-top:14px">${line(hv,"#fff")}</div><div style="opacity:.7;font-size:12px">Next 24 hours · ${off?"saved":"live"} data</div></div>
<div class="g"><div class="c"><div class="m">☔ Rain chance</div><div class="k">${d.precipitation_probability_max[0]}%</div><div class="m">${d.precipitation_sum[0]} mm today</div></div><div class="c"><div class="m">🌪️ Puyal / storm</div><div class="k" style="color:${lv=="R"?COL.R:"inherit"}">${lv=="R"?"Risk":"No"}</div><div class="m">Gusts ${Math.round(cu.wind_gusts_10m)} km/h</div></div><div class="c"><div class="m">💨 Wind</div><div class="k">${Math.round(cu.wind_speed_10m)}<span class="m"> km/h</span></div></div><div class="c"><div class="m">☀️ UV · Sun</div><div class="k">${Math.round(d.uv_index_max[0])}</div><div class="m">↑${d.sunrise[0].slice(11)} ↓${d.sunset[0].slice(11)}</div></div></div>
<div class="g" style="margin-top:12px"><div class="c">${ring(cu.relative_humidity_2m,100,cu.relative_humidity_2m+"%","#4cc9f0","Humidity")}</div><div class="c">${aq!=null?ring(aq,200,aq,aq<=50?COL.G:aq<=100?COL.Y:COL.R,"Air quality · "+(aq<=50?"Good":aq<=100?"Moderate":"Unhealthy")):`<div class="m">Air quality unavailable</div>`}</div></div>
<div class="c" style="margin-top:12px"><h3>Rain probability · next hours</h3>${bars(hp.filter((_,i)=>i%3==0).slice(0,8),hv.map((_,i)=>(h+i)%24+":00").filter((_,i)=>i%3==0).slice(0,8))}</div>
<div class="c"><h3>✅ What to do today</h3>${advise(me().type||"General",w,m).map(x=>`<div class="row">${x}</div>`).join("")}</div>
<div class="c"><h3>📶 Signal</h3>${sigBar()}</div>
<div class="c"><h3>🔔 Notifications</h3>${nearMe().slice(0,3).map(n=>`<div class="row"><span>${esc(n.msg)}</span><span class="m">${fmt(n.t)}</span></div>`).join("")||'<p class="m">No new notifications</p>'}<button class="s" onclick="Notification&&Notification.requestPermission()">Enable alerts on this phone</button></div>`};
P["my-location"]=async()=>{const l=DB.loc;log("Viewed my-location");let ad="";try{const r=await(await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${l.lat}&longitude=${l.lon}&localityLanguage=en`)).json();ad=[r.locality,r.city,r.principalSubdivision].filter(Boolean).join(", ")}catch(e){}
return`<h1>My location</h1><div class="c"><div class="k">${esc(l.district)}</div><div class="m">${esc(ad||"Address needs internet")}</div><div class="row"><span>Latitude</span><b>${l.lat.toFixed(5)}</b></div><div class="row"><span>Longitude</span><b>${l.lon.toFixed(5)}</b></div><div class="row"><span>Signal</span><span>${sigBar()}</span></div><button onclick="gps(()=>go('my-location'))">📍 Refresh GPS</button></div><div class="c">${mapSvg([{n:"You",la:l.lat,lo:l.lon,col:"#1c7ed6",lab:"You"}],0,1)}</div>`};
async function distList(){const{r,off}=await loadAll();return{r,off}}
P.districts=async()=>{const{r,off}=await distList();log("Viewed districts");if(!r)return`<h1>Districts</h1>`+noData();return`<h1>38 Districts</h1>${off?'<div class="c">📴 Saved data '+fmt(r.t)+"</div>":""}<input placeholder="Search district" oninput="document.querySelectorAll('.dr').forEach(e=>e.style.display=e.dataset.n.toLowerCase().includes(this.value.toLowerCase())?'':'none')"><div class="c">${r.a.map(x=>{const lv=lvl(x.g,x.code,x.pr,x.ps);return`<a class="row dr" data-n="${x.n}" href="#/districts/${x.n}"><span>${WC(x.code)[1]} <b>${x.n}</b></span><span>${Math.round(x.t)}° · ${x.pr}% ${pill(lv)}</span></a>`}).join("")}</div>`};
P.district=async n=>{const c=D.find(x=>x.n==n);if(!c)return"Not found";const{w,off}=await loadW(c,"w_"+n);log("Viewed district "+n);if(!w)return`<h1>${n}</h1>`+noData();const j=w.j,cu=j.current,d=j.daily,lv=lvl(Math.max(cu.wind_gusts_10m,d.wind_gusts_10m_max[0]),d.weather_code[0],d.precipitation_probability_max[0],d.precipitation_sum[0]),al=DB.alerts.filter(a=>a.d==n);
return`<a href="#/districts" class="m">‹ Districts</a><h1>${n} ${WC(cu.weather_code)[1]}</h1>${al.map(a=>`<div class="c" style="border-color:${COL[a.sev]}"><span class="pill ${a.sev}">Official alert</span><p><b>${esc(a.msg)}</b></p></div>`).join("")}<div class="c"><div class="k">${Math.round(cu.temperature_2m)}°C · ${WC(cu.weather_code)[0]}</div>${pill(lv)}<p class="m">${season(new Date().getMonth())}${off?" · saved "+fmt(w.t):""}</p><div class="row"><span>Rain chance</span><b>${d.precipitation_probability_max[0]}%</b></div><div class="row"><span>Wind gusts</span><b>${Math.round(cu.wind_gusts_10m)} km/h</b></div><div class="row"><span>Humidity</span><b>${cu.relative_humidity_2m}%</b></div></div><div class="c"><h3>🌾 What to do</h3>${advise("Farmer",w,new Date().getMonth()).map(x=>`<div class="row">${x}</div>`).join("")}</div>`};
P.forecast=async()=>{const c=DB.loc,{w,off}=await loadW({la:c.lat,lo:c.lon},"w_"+c.district);if(!w)return`<h1>Forecast</h1>`+noData();log("Viewed forecast");const d=w.j.daily,days=d.time.map((t,i)=>({t,i,hi:d.temperature_2m_max[i],lo:d.temperature_2m_min[i],pr:d.precipitation_probability_max[i],ps:d.precipitation_sum[i],g:d.wind_gusts_10m_max[i],code:d.weather_code[i]})),lo=Math.min(...days.map(x=>x.lo)),hi=Math.max(...days.map(x=>x.hi)),tm=days[1],dn=t=>new Date(t).toLocaleDateString("en-IN",{weekday:"short",day:"numeric"});
return`<h1>Forecast</h1>${off?'<div class="c">📴 Saved '+fmt(w.t)+"</div>":""}<div class="c"><div class="m">Tomorrow · ${esc(c.district)}</div><div class="k">${WC(tm.code)[1]} ${Math.round(tm.hi)}° / ${Math.round(tm.lo)}°</div><div>${tm.pr}% rain · ${tm.ps} mm · gusts ${Math.round(tm.g)} km/h</div><div style="margin-top:8px">${pill(lvl(tm.g,tm.code,tm.pr,tm.ps))}</div></div>
<div class="c"><h3>7-day</h3>${days.slice(1).map(x=>`<div class="row"><span style="width:62px">${dn(x.t)}</span><span>${WC(x.code)[1]}</span><span class="m" style="width:36px">${x.pr}%</span><span class="m">${Math.round(x.lo)}°</span><div class="bar"><i style="left:${(x.lo-lo)/(hi-lo||1)*100}%;right:${100-(x.hi-lo)/(hi-lo||1)*100}%"></i></div><b>${Math.round(x.hi)}°</b></div>`).join("")}</div>
<div class="c"><h3>Rain probability</h3>${bars(days.slice(1).map(x=>x.pr),days.slice(1).map(x=>dn(x.t).split(" ")[0]))}</div>
<div class="c"><h3>🌪️ Early puyal warning timeline</h3>${days.slice(1).map(x=>{const l=lvl(x.g,x.code,x.pr,x.ps);return`<div class="row"><span>${dn(x.t)}</span><span>${l=="R"?"Storm winds / very heavy rain – prepare now":l=="Y"?"Heavy rain watch":"No warning"}</span>${pill(l)}</div>`}).join("")}<p class="m">Computed from live forecast. For official cyclone bulletins follow IMD Chennai.</p></div>`};
P["map-view"]=async()=>{const{r,off}=await distList();log("Viewed map");if(!r)return`<h1>Map</h1>`+noData();const pts=r.a.map(x=>({...x,col:COL[lvl(x.g,x.code,x.pr,x.ps)]})),cnt={G:0,Y:0,R:0};r.a.forEach(x=>cnt[lvl(x.g,x.code,x.pr,x.ps)]++);return`<h1>Tamil Nadu map</h1><div class="c"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px"><span class="pill G">Clear ${cnt.G}</span><span class="pill Y">Rain ${cnt.Y}</span><span class="pill R">Puyal ${cnt.R}</span></div>${mapSvg(pts,1)}<p class="m">Tap a district. ${off?"Saved data "+fmt(r.t):"Live · "+fmt(r.t)}</p></div>`};
const REM={blight:["Leaf blight / brown spot","Remove infected leaves. Spray neem oil 5% or Carbendazim. Avoid overhead watering."],yellow:["Yellowing – nitrogen deficiency or mosaic","Apply compost or urea. Use yellow sticky traps for whitefly."],mildew:["Powdery mildew","Spray wettable sulphur or 1% baking-soda solution. Improve airflow."],ok:["Looks healthy","No disease signs found. Continue regular care."]};
P["crop-doctor"]=()=>`<h1>Crop Doctor</h1><div class="c"><label class="m">Take or upload a clear leaf photo</label><input type="file" accept="image/*" capture="environment" onchange="scan(this)"><canvas id="cv" width="96" height="96" hidden></canvas><div id="res"></div><p class="m">Quick colour-based scan. For lab-grade disease detection a PlantVillage-trained model is needed – ask an agri officer for serious cases.</p></div>`;
function scan(i){const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const x=$("#cv").getContext("2d");x.drawImage(im,0,0,96,96);const p=x.getImageData(0,0,96,96).data;let b=0,y=0,w=0,n=p.length/4;for(let k=0;k<p.length;k+=4){const r=p[k],g=p[k+1],bl=p[k+2];if(r>g&&g>bl&&r<190)b++;else if(r>170&&g>150&&bl<120)y++;else if(r>200&&g>200&&bl>200)w++}const k=b/n>.18?"blight":y/n>.22?"yellow":w/n>.15?"mildew":"ok",r=REM[k];$("#res").innerHTML=`<img src="${im.src}" style="width:100%;border-radius:18px;margin-top:10px"><h3 style="margin-top:12px">${r[0]}</h3><p>${r[1]}</p>`;log("Crop checked: "+r[0])};im.src=URL.createObjectURL(f)}
let mf;P["mandi-price"]=()=>{const f=mf||DB.loc.district,rows=DB.mandi.filter(m=>m.d==f);log("Viewed mandi "+f);return`<h1>Mandi prices</h1><select onchange="mf=this.value;go('mandi-price')">${DN.map(d=>`<option ${d==f?"selected":""}>${d}`).join("")}</select><div class="c">${rows.length?`<div class="tb"><table><tr><th>Item<th>₹ / kg<th>Updated</tr>${rows.map(m=>`<tr><td>${esc(m.i)}<td><b>₹${m.p}</b><td class="m">${fmt(m.t)}`).join("")}</table></div>`:`<p class="m">No prices posted for ${f} yet. Admin updates market prices here.</p>`}</div>`};
P.activity=()=>{const u=me().name,l=DB.logs.filter(x=>x.u==u);return`<h1>Activity</h1><div class="c"><h3>Alerts received</h3>${nearMe().map(n=>`<div class="row"><span>${esc(n.msg)}</span><span class="m">${fmt(n.t)}</span></div>`).join("")||'<p class="m">None</p>'}</div><div class="c"><h3>History</h3>${l.slice(0,60).map(x=>`<div class="row"><span>${esc(x.a)}</span><span class="m">${fmt(x.t)}</span></div>`).join("")||'<p class="m">Nothing yet</p>'}</div>`};
P.profile=()=>{const u=me();return`<h1>Profile</h1><div class="c"><input id="pn" value="${esc(u.name)}"><input value="${esc(u.email)}" disabled><select id="pd">${DN.map(d=>`<option ${u.district==d?"selected":""}>${d}`).join("")}</select><select id="pu">${["Farmer","General","Fisherman","Student"].map(t=>`<option ${u.type==t?"selected":""}>${t}`).join("")}</select><select id="pl"><option value="en">English</option><option value="ta" ${DB.lang=="ta"?"selected":""}>தமிழ்</option></select><label class="row"><span>Notifications</span><input id="pt" type="checkbox" style="width:auto" ${DB.nt!==false?"checked":""}></label><button onclick="saveProf()">Save changes</button></div>
<div class="c"><h3>🚨 Emergency contacts</h3><p class="m">These people get your SOS message with live location.</p>${DB.contacts.map((c,i)=>`<div class="row"><span>${esc(c.n)} · ${esc(c.p)}</span><a onclick="DB.contacts.splice(${i},1);save();go('profile')" style="color:var(--r)">Remove</a></div>`).join("")}<input id="cn" placeholder="Contact name"><input id="cp" type="tel" placeholder="Phone number"><button class="s" onclick="addCt()">Add contact</button></div><button class="d" onclick="logout()">Sign out</button>`};
function saveProf(){const u=me();u.name=$("#pn").value;u.district=$("#pd").value;u.type=$("#pu").value;DB.lang=$("#pl").value;DB.nt=$("#pt").checked;const c=D.find(x=>x.n==u.district);DB.loc={lat:c.la,lon:c.lo,district:c.n,t:Date.now()};save();if(SBon())sbq("/rest/v1/profiles?id=eq."+u.id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({name:u.name,district:u.district,type:u.type})}).catch(x=>toast(x.message));log("Profile updated");toast("Saved");go("profile")}
function addCt(){const n=$("#cn").value.trim(),p=$("#cp").value.replace(/[^\d+]/g,"");if(!n||p.length<8)return toast("Enter name and valid number");if(DB.contacts.length>=5)return toast("Max 5 contacts");DB.contacts.push({n,p});save();go("profile")}
P.sos=()=>`<h1>Emergency</h1><div class="c" style="text-align:center"><button id="sos" onclick="sos()">SOS</button><p class="m">Tap once. Your GPS location is sent by message to ${DB.contacts.length?DB.contacts.map(c=>esc(c.n)).join(", "):"your emergency contacts"} and recorded for the admin.</p>${DB.contacts.length?"":'<button class="s" onclick="go(\'profile\')">Add emergency contacts first</button>'}<a href="tel:112"><button class="d">📞 Call 112 (national emergency)</button></a></div>`;
function sos(){if(!DB.contacts.length){toast("Add emergency contacts first");return go("profile")}toast("Getting your location…");const done=(la,lo,ex)=>{const msg=`🚨 EMERGENCY! ${me().name} needs help.\nLocation: https://maps.google.com/?q=${la},${lo}${ex?"\n(approximate)":""}\nTime: ${new Date().toLocaleString("en-IN")}`;DB.sosl.unshift({u:me().name,d:DB.loc.district,la,lo,t:Date.now()});log("🚨 SOS sent");save();if(SBon())sbq("/rest/v1/sos",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({user_id:DB.sess.id,user_name:me().name,district:DB.loc.district,lat:la,lon:lo})}).catch(()=>{});const nums=DB.contacts.map(c=>c.p),ios=/iPhone|iPad/.test(navigator.userAgent),sms=`sms:${nums.join(ios?",":";")}${ios?"&":"?"}body=${encodeURIComponent(msg)}`;
const s=document.createElement("div");s.className="sh";s.innerHTML=`<div><h3>🚨 Send emergency message</h3><p class="m">${esc(msg).replace(/\n/g,"<br>")}</p><a href="${sms}"><button>💬 Send SMS to all contacts</button></a>${DB.contacts.map(c=>`<a href="https://wa.me/${c.p.replace(/\D/g,"")}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener"><button class="s">WhatsApp · ${esc(c.n)}</button></a>`).join("")}<button class="s" onclick="this.closest('.sh').remove()">Close</button></div>`;document.body.appendChild(s);location.href=sms};
navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>done(p.coords.latitude,p.coords.longitude),()=>done(DB.loc.lat,DB.loc.lon,1),{timeout:8000,enableHighAccuracy:true}):done(DB.loc.lat,DB.loc.lon,1)}
P.more=()=>`<h1>More</h1><div class="c">${[["my-location","📍","My location"],["districts","🏙️","Districts"],["mandi-price","🧺","Mandi prices"],["activity","🕘","Activity"],["profile","👤","Profile"],["sos","🚨","SOS"]].map(x=>`<a class="row" href="#/${x[0]}"><span>${x[1]}&nbsp; ${x[2]}</span><span class="m">›</span></a>`).join("")}${me().id=="admin"?'<a class="row" href="#/admin/dashboard"><span>🛠️&nbsp; Admin panel</span><span class="m">›</span></a>':""}</div>`;
// ---------- admin ----------
const A=["dashboard","users","weather-control","mandi-control","notifications","logs"];
const st=(a,b)=>`<div class="c"><div class="k">${a}</div><div class="m">${b}</div></div>`,tbl=(h,r)=>`<div class="c tb"><table><tr>${h.map(x=>`<th>${x}`).join("")}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${y}`).join("")}`).join("")}</table></div>`;
P.dashboard=()=>{const by={};DB.users.forEach(u=>by[u.district]=(by[u.district]||0)+1);const e=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=e[0]?e[0][1]:1;
return`<h1>Dashboard</h1><div class="g">${st(DB.users.length,"Total users")}${st(DB.users.filter(u=>Date.now()-u.last<864e5).length,"Active today")}${st(DB.alerts.length,"Alerts live")}${st(DB.notes.length,"Notifications sent")}</div><div class="c" style="margin-top:12px"><h3>Users by district</h3>${e.map(([d,n])=>`<div class="row"><span style="width:110px">${d}</span><div class="bar"><i style="left:0;right:${100-n/mx*100}%;background:var(--ac)"></i></div><b>${n}</b></div>`).join("")||'<p class="m">No users yet</p>'}</div><div class="c"><h3>🚨 Recent SOS</h3>${DB.sosl.slice(0,8).map(s=>`<div class="row"><span>${esc(s.u)} · ${esc(s.d)}</span><a href="https://maps.google.com/?q=${s.la},${s.lo}" target="_blank">Map</a></div>`).join("")||'<p class="m">None</p>'}</div><p class="m">Data shown is from this device. Add Supabase keys to see every user’s phone in one place.</p>`};
P.users=()=>`<h1>Users</h1>`+tbl(["Name","District","Type","Last active",""],DB.users.map(u=>[esc(u.name)+`<div class="m">${esc(u.email)}</div>`,esc(u.district),u.type,fmt(u.last),`<button class="${u.blocked?"":"d"}" style="padding:8px" onclick="blk('${u.id}')">${u.blocked?"Unblock":"Block"}</button>`]));
async function blk(id){const u=DB.users.find(x=>x.id==id);u.blocked=!u.blocked;if(SBon())try{await sbq("/rest/v1/profiles?id=eq."+id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({blocked:u.blocked})})}catch(x){u.blocked=!u.blocked;return toast(x.message)}log((u.blocked?"Blocked ":"Unblocked ")+u.name);save();go("admin/users")}
async function delRow(k,i,pg){const T={alerts:"alerts",mandi:"mandi"},r=DB[k][i];if(SBon()&&r.id)try{await sbq(`/rest/v1/${T[k]}?id=eq.${r.id}`,{method:"DELETE",headers:{Prefer:"return=minimal"}})}catch(x){return toast(x.message)}DB[k].splice(i,1);save();go("admin/"+pg)}
P["weather-control"]=()=>`<h1>Weather alerts</h1><div class="c"><select id="wd">${DN.map(d=>`<option>${d}`).join("")}</select><select id="ws"><option value="Y">Rain warning</option><option value="R">Storm / Puyal warning</option></select><input id="wm" placeholder="Alert message"><button onclick="addAlert()">Publish & push notify</button><p class="m">Admin alerts appear as “Official alert” cards. They never change the live measured weather.</p></div>`+tbl(["District","Level","Message",""],DB.alerts.map((a,i)=>[a.d,pill(a.sev),esc(a.msg),`<button class="d" style="padding:8px" onclick="delRow('alerts',${i},'weather-control')">Delete</button>`]));
async function addAlert(){const m=$("#wm").value.trim();if(!m)return toast("Write a message");const d=$("#wd").value,sev=$("#ws").value;
if(SBon()){try{const H={Prefer:"return=minimal"};await sbq("/rest/v1/alerts",{method:"POST",headers:H,body:JSON.stringify({district:d,sev,msg:m})});await sbq("/rest/v1/notifications",{method:"POST",headers:H,body:JSON.stringify({target:d,msg:"⚠️ "+m})});await pullAll()}catch(x){return toast(x.message)}}else{DB.alerts.unshift({d,sev,msg:m,t:Date.now()});DB.notes.unshift({to:d,msg:"⚠️ "+m,t:Date.now()})}log("Alert for "+d);save();toast("Alert published");go("admin/weather-control")}
P["mandi-control"]=()=>`<h1>Mandi prices</h1><div class="c"><select id="md">${DN.map(d=>`<option>${d}`).join("")}</select><input id="mi" placeholder="Item (Rice, Tomato…)"><input id="mp" type="number" inputmode="decimal" placeholder="₹ per kg"><button onclick="setP()">Add / update</button></div>`+tbl(["District","Item","₹",""],DB.mandi.map((m,i)=>[m.d,esc(m.i),m.p,`<button class="d" style="padding:8px" onclick="delRow('mandi',${i},'mandi-control')">✕</button>`]));
async function setP(){const d=$("#md").value,i=$("#mi").value.trim(),p=+$("#mp").value;if(!i||!(p>0))return toast("Fill item and price");
if(SBon()){try{await sbq("/rest/v1/mandi?on_conflict=district,item",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({district:d,item:i,price:p,updated_at:new Date().toISOString()})});await pullAll()}catch(x){return toast(x.message)}}else{const r=DB.mandi.find(m=>m.d==d&&m.i.toLowerCase()==i.toLowerCase());r?(r.p=p,r.t=Date.now()):DB.mandi.push({d,i,p,t:Date.now()})}log("Price "+d+" "+i);save();go("admin/mandi-control")}
P.notifications=()=>`<h1>Broadcast</h1><div class="c"><select id="nd"><option value="all">All users</option>${DN.map(d=>`<option>${d}`).join("")}</select><input id="nm2" placeholder="Message"><button onclick="bc()">Send notification</button></div>`+tbl(["To","Message","Time"],DB.notes.map(n=>[n.to,esc(n.msg),fmt(n.t)]));
async function bc(){const m=$("#nm2").value.trim();if(!m)return;const to=$("#nd").value;if(SBon()){try{await sbq("/rest/v1/notifications",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({target:to,msg:m})});await pullAll()}catch(x){return toast(x.message)}}else DB.notes.unshift({to,msg:m,t:Date.now()});log("Broadcast to "+to);save();if(window.Notification&&Notification.permission=="granted")new Notification("Green Guard",{body:m});toast("Sent");go("admin/notifications")}
P.logs=()=>`<h1>Activity logs</h1>`+tbl(["Who","District","Action","When"],DB.logs.map(l=>[esc(l.u),esc(l.d),esc(l.a),fmt(l.t)]));
// ---------- router ----------
function go(r){if(location.hash=="#/"+r)route();else location.hash="#/"+r}
async function route(){const r=location.hash.replace("#/","")||"home",a=$("#app");if(!DB.loc&&r!="splash")return go("splash");if(!DB.sess&&!["splash","login"].includes(r))return go("login");
const adm=r.startsWith("admin");if(adm&&DB.sess.role!="admin"){toast("Admin only");return go("home")}
if(DB.sess&&Date.now()-lastPull>45000){lastPull=Date.now();const pp=pullAll();if(adm||!DB.pulled)await pp}
const[p,arg]=(adm?r.slice(6):r).split("/"),nv=$("#nv");
nv.innerHTML=["splash","login"].includes(r)?"":adm?"":`<div class="tab">${[["home","🏠",L("home")],["forecast","🌦️",L("fc")],["map-view","🗺️",L("map")],["crop-doctor","🌿",L("crop")],["more","⋯",L("more")]].map(x=>`<a href="#/${x[0]}" class="${r.split("/")[0]==x[0]?"on":""}"><b>${x[1]}</b>${x[2]}</a>`).join("")}</div>`;
const f=adm?P[p]:p=="districts"&&arg?()=>P.district(decodeURIComponent(arg)):P[p];a.style.animation="none";a.offsetHeight;a.style.animation="";a.innerHTML=(adm?`<div class="seg">${A.map(x=>`<a href="#/admin/${x}" class="${p==x?"on":""}">${x.replace("-control","").replace("-"," ")}</a>`).join("")}<a href="#/home">User app</a><a onclick="logout()">Sign out</a></div>`:"")+'<div class="m" style="padding:40px;text-align:center">Loading…</div>';
const h=f?await f():"Page not found";a.innerHTML=(adm?a.firstChild.outerHTML:"")+h;if(p=="splash"){$("#gs").textContent="📡 Detecting…";gps()}window.scrollTo(0,0)}
addEventListener("error",e=>toast("Error: "+e.message));addEventListener("unhandledrejection",e=>toast("Error: "+(e.reason&&e.reason.message||e.reason)));addEventListener("hashchange",route);addEventListener("offline",()=>toast("Offline – showing saved data"));addEventListener("online",()=>{toast("Back online");route()});startSession().finally(route);
</script></body></html>
